            ZBRA
        run: |
          python - <<'PY'
          import csv
          import os
          import pathlib
          import zipfile

          def norm_symbol(s: str) -> str:
              return s.strip().upper().replace(".", "-")

          def symbol_from_member(member: str) -> str:
              name = pathlib.PurePosixPath(member).name.lower()
              if not name.endswith(".txt"):
                  return ""
              stem = name[:-4]
              if stem.endswith(".us"):
                  stem = stem[:-3]
              return norm_symbol(stem)

          wanted = {
              norm_symbol(x)
              for x in os.environ["REQUIRED_SYMBOLS"].splitlines()
              if x.strip()
          }

          src = pathlib.Path("d_us_txt.zip")
          out_dir = pathlib.Path("subset")
          out_dir.mkdir(exist_ok=True)

          found = {}
          with zipfile.ZipFile(src, "r") as zin:
              for member in zin.namelist():
                  sym = symbol_from_member(member)
                  if sym in wanted:
                      found.setdefault(sym, []).append(member)

              chosen = {}
              for sym, matches in found.items():
                  matches = sorted(
                      matches,
                      key=lambda x: ("stocks" not in x.lower(), len(x), x.lower())
                  )
                  member = matches[0]
                  chosen[sym] = member
                  with zin.open(member) as r, open(out_dir / f"{sym.lower()}.us.txt", "wb") as w:
                      while True:
                          chunk = r.read(1024 * 1024)
                          if not chunk:
                              break
                          w.write(chunk)

          with open("v8_stooq_subset_status.csv", "w", newline="", encoding="utf-8") as f:
              writer = csv.writer(f)
              writer.writerow(["ticker", "found", "chosen_member", "all_matches"])
              for sym in sorted(wanted):
                  matches = found.get(sym, [])
                  writer.writerow([
                      sym,
                      bool(matches),
                      chosen.get(sym, ""),
                      " | ".join(matches),
                  ])

          with zipfile.ZipFile(
              "v8_stooq_subset.zip",
              "w",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=6,
          ) as zout:
              for p in sorted(out_dir.glob("*.txt")):
                  zout.write(p, arcname=p.name)
              zout.write("v8_stooq_subset_status.csv")

          missing = sorted(wanted - set(found))
          print(f"Required: {len(wanted)}")
          print(f"Found:    {len(found)}")
          print(f"Missing:  {len(missing)}")
          if missing:
              print("Missing symbols:", ", ".join(missing))
          print("Created:", pathlib.Path("v8_stooq_subset.zip").stat().st_size, "bytes")
          PY

      - name: Upload filtered subset
        uses: actions/upload-artifact@v4
        with:
          name: v8-stooq-subset
          path: |
            v8_stooq_subset.zip
            v8_stooq_subset_status.csv
          retention-days: 7
          compression-level: 0
