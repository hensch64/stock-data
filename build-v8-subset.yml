name: Build V8 Stooq subset

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-v8-subset.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Stooq release asset
        run: |
          curl -L --fail --retry 5 --retry-delay 3 \
            -o d_us_txt.zip \
            "https://github.com/hensch64/stock-data/releases/download/v1/d_us_txt.zip"
          ls -lh d_us_txt.zip

      - name: Extract only V8/QMM symbols
